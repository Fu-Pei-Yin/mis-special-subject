{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MINDGUARD 首頁</title>
  <link rel="stylesheet" href="{% static 'css/header.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer.css' %}">
  <script src="{% static 'js/main.js' %}"></script>
</head>
<body>
  {% include "header.html" %}
  <main class="hero">
    <h1>揭開社群數據下的<br><span>心理風險真相</span></h1>
    <p class="desc">
      只需輸入 Threads 使用者名稱，即可分析憂鬱風險
    </p>
    <form method="POST" action="{% url 'analyze' %}">
      {% csrf_token %}
      <div class="input-group">
        <input
          type="text"
          name="username"
          pattern="^[A-Za-z0-9._]+$"
          title="僅允許英文字母、數字、底線(_)與句點(.)"
          placeholder="@threads_username"
          required
        />
        <button type="submit">分析使用者 →</button>
      </div>
    </form>
  </main>
  {% include "footer.html" %}
</body>
</html>
