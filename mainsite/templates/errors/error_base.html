<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{{ title|default:"系統提示 - MINDGUARD" }}</title>
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/errors.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <script defer src="/static/js/errors.js"></script>
</head>
<body>
    {% include "header.html" %}

    <main class="error-container">
        <div class="error-card">
            <div class="error-icon">
                {% block icon %}⚠️{% endblock %}
            </div>

            <h1 class="error-title">
                {% block title %}發生問題{% endblock %}
            </h1>

            <p class="error-message">
                {% block message %}{% endblock %}
            </p>

            <div class="error-actions">
                {% block actions %}
                <a href="{% url 'index' %}" class="btn-primary">返回首頁</a>
                {% endblock %}
            </div>

            <div class="error-footer">
                MINDGUARD AI SYSTEM • NON-DIAGNOSTIC USE ONLY
            </div>
        </div>
    </main>

    {% include "footer.html" %}
</body>
</html>
