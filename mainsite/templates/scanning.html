<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Threads Depression Screener</title>
  <link rel="stylesheet" href="/static/css/header.css">
  <link rel="stylesheet" href="/static/css/scanning.css">
  <link rel="stylesheet" href="/static/css/footer.css">
  <script src="/static/js/scanning.js"></script>
</head>
<body>
    {% include "header.html" %}
    <main class="scanning">
    <div class="ring">
        <div class="spinner"></div>
        <span>AI</span>
    </div>
    <h2>正在掃描 @{{ username }}</h2>
    <p>正在擷取近 14 天貼文、行為模式與語意特徵…</p>
    <form id="forwardForm" method="POST" action="{% url 'result' %}">
        {% csrf_token %}
        <input type="hidden" name="username" value="{{ username }}">
    </form>
    </main>
    <script>
    setTimeout(() => {
        document.getElementById("forwardForm").submit();
    }, 10000);
    </script>
    {% include "footer.html" %}
</body>
</html>
