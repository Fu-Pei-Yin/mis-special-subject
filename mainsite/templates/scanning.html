{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Threads Depression Screener</title>
  <link rel="stylesheet" href="{% static 'css/header.css' %}">
  <link rel="stylesheet" href="{% static 'css/scanning.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer.css' %}">
  <script src="{% static 'js/scanning.js' %}" defer></script>
</head>
<body>
    {% include "header.html" %}
    <main class="scanning">
        <div class="ring">
            <div class="spinner"></div>
            <span>AI</span>
        </div>
        <h2>正在掃描 @{{ username }}</h2>
        <!-- data-username 供 scanning.js 讀取 -->
        <p data-username="{{ username }}">正在連線至 Threads...</p>
        <form id="forwardForm" method="POST" action="{% url 'result' %}">
            {% csrf_token %}
            <input type="hidden" name="username" value="{{ username }}">
        </form>
    </main>
    {% include "footer.html" %}
</body>
</html>
